<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO Social Self-Serve - Exact Figma Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Special Gothic';
  src: url('https://use.typekit.net/af/79a2bb/00000000000000007735bb91/30/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sans: "Special Gothic", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", monospace;
  --accent: #6FE0ED;
  --text-bright: #F4F5F5;
  --ground: #000F0F;
  --border: #6F908C;
}

body {
  background: var(--ground);
  color: var(--text-bright);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
}

.container {
  display: grid;
  grid-template-columns: 400px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: #081F1E;
  border-right: 1px solid #1F403E;
  padding: 24px;
  overflow-y: auto;
}

.preview-area {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

h1 {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #6F908C;
  margin-bottom: 8px;
}

select, input, textarea {
  width: 100%;
  background: #13302E;
  border: 1px solid #1F403E;
  color: var(--text-bright);
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 13px;
  border-radius: 4px;
}

select:focus, input:focus, textarea:focus {
  outline: none;
  border-color: #104B55;
}

textarea {
  resize: vertical;
  min-height: 60px;
}

.btn-primary {
  background: var(--accent);
  color: var(--ground);
  border: none;
  padding: 12px 20px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  margin-top: 24px;
}

/* CANVAS - 540x540 (50% of 1080x1080) */
.preview-canvas {
  width: 540px;
  height: 540px;
  background: #0b0f0a;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* Background terrain image */
.canvas-bg-terrain {
  position: absolute;
  inset: 0;
  background-image: url('assets/terrain.png');
  background-size: cover;
  background-position: center;
  opacity: 0.3;
  pointer-events: none;
  z-index: 1;
}

/* ========================================
   TEMPLATE: MODEL LAUNCH MODELS (Announcement)
   Figma: 74:1079
   ======================================== */

.template-announcement {
  position: absolute;
  left: 66px;      /* 132 ÷ 2 */
  top: 56.5px;     /* 113 ÷ 2 */
  width: 408px;    /* 816 ÷ 2 */
  display: flex;
  flex-direction: column;
  gap: 44px;       /* Gap between logo and content */
  z-index: 10;
}

.template-announcement .logo {
  width: 215px;    /* 430 ÷ 2 */
  height: 36.5px;  /* 73 ÷ 2 */
}

.template-announcement .logo svg {
  width: 100%;
  height: 100%;
  fill: var(--text-bright);
}

.template-announcement .text-block {
  font-family: var(--sans);
  font-size: 32px;   /* 64 ÷ 2 */
  font-weight: 400;
  line-height: 1.125; /* 72/64 */
  letter-spacing: -0.15px; /* -0.3 ÷ 2 */
  color: var(--text-bright);
}

.template-announcement .text-block:first-of-type {
  margin-bottom: 20px; /* Gap between two text blocks scaled */
}

.template-announcement .pills {
  display: flex;
  flex-direction: column;
  gap: 12px;  /* 24 ÷ 2 */
  margin-top: 36px; /* 72 ÷ 2 */
}

.template-announcement .pills-row {
  display: flex;
  gap: 12px;  /* 24 ÷ 2 */
}

.template-announcement .pill {
  backdrop-filter: blur(0.75px); /* 1.5 ÷ 2 */
  background: rgba(0, 15, 15, 0.5);
  border: 1.25px solid var(--border); /* 2.5 ÷ 2 */
  border-radius: 7px;  /* 14 ÷ 2 */
  padding: 9px 20px;   /* 18 ÷ 2, 40 ÷ 2 */
  font-family: var(--mono);
  font-size: 14px;    /* 28 ÷ 2 - wait, let me check Figma again for text size */
  font-weight: 500;
  letter-spacing: 0.26px;
  text-transform: uppercase;
  color: var(--accent);
  text-align: center;
  white-space: nowrap;
  flex: 1;
}

/* Hidden by default - all templates start hidden except first */
.template-product,
.template-promo,
.template-partnership-h,
.template-partnership-v,
.template-event {
  display: none !important;
}

/* Active state shows the template */
.template-announcement.active,
.template-product.active,
.template-promo.active,
.template-partnership-h.active,
.template-partnership-v.active,
.template-event.active {
  display: flex !important;
}

</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// Template switching
document.getElementById('templateSelect').addEventListener('change', function(e) {
  document.querySelectorAll('[class^="template-"]').forEach(el => el.classList.remove('active'));
  document.querySelector('.template-' + e.target.value).classList.add('active');
});

// PNG Download
document.getElementById('downloadBtn').addEventListener('click', async function() {
  const preview = document.querySelector('.preview-canvas');
  const canvas = await html2canvas(preview, {
    scale: 2,
    backgroundColor: '#0b0f0a',
    logging: false
  });

  const link = document.createElement('a');
  link.download = 'do-social-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
});
</script>
