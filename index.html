<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Templates · DigitalOcean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Social Templates <b>·</b> DigitalOcean</h1>
    <p class="sub">Event, model launch and partnership posts. Pick a template and a layout, fill in the copy, download a PNG or a looping video.</p>
  </header>

  <main class="layout">
    <form class="panel" id="controls">
      <fieldset>
        <legend><span class="sect">Template</span></legend>
        <div class="segmented" data-group="template">
          <button type="button" data-value="event">Event</button>
          <button type="button" data-value="model">Model launch</button>
          <button type="button" data-value="partner">Partnership</button>
        </div>
        <label>Layout</label>
        <div class="segmented" id="variants"></div>
        <label>Size</label>
        <div class="segmented" data-group="format">
          <button type="button" data-value="square">Square</button>
          <button type="button" data-value="landscape">Landscape</button>
        </div>
      </fieldset>

      <fieldset>
        <legend><span class="sect">Color</span></legend>
        <div class="swatches" data-group="theme">
          <button type="button" data-value="foam"><span class="dot" style="--c: #60a5af"></span>Foam</button>
          <button type="button" data-value="algae"><span class="dot" style="--c: #879b42"></span>Algae</button>
          <button type="button" data-value="lilac"><span class="dot" style="--c: #b17ea4"></span>Lilac</button>
        </div>
      </fieldset>

      <fieldset>
        <legend><span class="sect">Copy</span></legend>
        <label data-field="eyebrow">Eyebrow
          <input name="eyebrow" type="text">
        </label>
        <label data-field="title">Model name
          <input name="title" type="text">
        </label>
        <label data-field="headline">Headline <span class="hint">Blank line starts a new paragraph</span>
          <textarea name="headline" rows="4"></textarea>
        </label>
        <label data-field="label">Label above the pills
          <input name="label" type="text">
        </label>
        <label data-field="pills">Pills <span class="hint">One per line</span>
          <textarea name="pills" rows="4"></textarea>
        </label>
      </fieldset>

      <fieldset data-field="partner">
        <legend><span class="sect">Partner logo</span></legend>
        <label>Select partner <span class="hint">Search or select from list</span>
          <input name="partnerSearch" type="text" list="partners" placeholder="Type to search...">
          <datalist id="partners"></datalist>
        </label>
      </fieldset>

      <fieldset data-field="cohosts">
        <legend><span class="sect">Cohosts</span></legend>
        <label>Label
          <input name="cohostLabel" type="text">
        </label>
        <div id="cohosts" class="stack"></div>
      </fieldset>

      <fieldset data-field="speakers">
        <legend><span class="sect">Speakers</span></legend>
        <div id="speakers" class="stack"></div>
      </fieldset>

      <fieldset>
        <legend><span class="sect">Background</span></legend>
        <div class="segmented" data-group="bg">
          <button type="button" data-value="terrain">Static</button>
          <button type="button" data-value="animated">Animated</button>
        </div>
        <label data-bg="terrain animated">Terrain <output id="seedValue"></output>
          <input name="seed" type="range" min="1" max="40" step="1">
        </label>
        <div class="segmented" data-group="style">
          <button type="button" data-value="outline">Outline</button>
          <button type="button" data-value="filled">Filled</button>
        </div>
        <div class="segmented" data-group="motion" data-bg="animated">
          <button type="button" data-value="forward">Forward</button>
          <button type="button" data-value="rotate">Rotate</button>
        </div>
        <label data-bg="animated">Speed <output id="speedValue"></output>
          <input name="speed" type="range" min="0.5" max="8" step="0.5">
        </label>
        <label data-bg="animated">Video length <output id="clipValue"></output>
          <input name="clip" type="range" min="5" max="25" step="1">
        </label>
        <label>Shade <output id="shadeValue"></output>
          <input name="shade" type="range" min="0" max="80" step="5">
        </label>
      </fieldset>

      <fieldset>
        <legend><span class="sect">Text animation</span></legend>
        <div class="segmented" data-group="textAnim">
          <button type="button" data-value="none">None</button>
          <button type="button" data-value="fade">Fade in</button>
          <button type="button" data-value="rise">Slide up</button>
        </div>
        <div class="file-row">
          <button type="button" class="btn ghost" id="replay" hidden>Replay</button>
        </div>
      </fieldset>
    </form>

    <section class="stage" id="stage" aria-label="Previews">
      <div class="canvas main">
        <div class="cbar">
          <span class="k" id="mainLabel"></span>
          <div class="cbar-buttons"><button type="button" class="btn ghost" id="video" hidden>Download video</button><button type="button" class="btn" id="download">Download PNG</button></div>
        </div>
        <div class="view"><canvas id="main" width="1080" height="1080"></canvas></div>
      </div>
      <div class="others" id="others"></div>
    </section>
  </main>

  <script src="assets.js"></script>
  <script src="terrain-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
